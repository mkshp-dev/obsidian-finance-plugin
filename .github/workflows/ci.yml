name: CI

on:
  pull_request:
    branches:
      - Dev
  push:
    branches:
      - Dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
    verify:
      name: Lint, build, and test
      runs-on: ubuntu-latest
      timeout-minutes: 15
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Install beanquery (for SystemDetector detection tests)
          run: pip3 install beanquery --break-system-packages

        - name: Run lint
          run: npm run lint

        - name: Run build
          run: npm run build

        - name: Run tests
          run: npm test
